<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Bright Pocket VPN</title><link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/styles.css"></head><body><header class="shell nav"><a class="brand" href="/"><span class="brand-mark"></span>Bright Pocket VPN</a><a href="/track.html">Track as guest</a></header><main class="shell page"><div class="page-head"><h1 id="auth-title">Welcome back.</h1><a href="/">View plans</a></div><section class="panel"><div class="tabs" role="tablist"><button type="button" data-tab="password" aria-selected="true">Password</button><button type="button" data-tab="code">Six-digit code</button><button type="button" data-tab="register">Create account</button><button type="button" data-tab="trial">Start free</button></div>
<form id="password-form" class="form"><div class="field"><label for="login-email">Email</label><input id="login-email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" required></div><button>Sign in</button><button class="secondary" type="button" id="forgot">Forgot password?</button></form>
<form id="code-form" class="form hidden"><div class="field"><label for="code-email">Email</label><input id="code-email" name="email" type="email" autocomplete="email" required></div><div class="form-row"><button type="button" class="secondary request-code">Send code</button><div class="field"><label for="login-code">Six-digit code</label><input id="login-code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div></div><button>Verify and sign in</button></form>
<form id="register-form" class="form hidden"><div class="field"><label for="reg-name">Name</label><input id="reg-name" name="name" autocomplete="name" required></div><div class="field"><label for="reg-email">Email</label><input id="reg-email" name="email" type="email" autocomplete="email" required></div><button type="button" class="secondary request-code">Send verification code</button><div class="field"><label for="reg-code">Six-digit code</label><input id="reg-code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div><div class="field"><label for="reg-password">Password</label><input id="reg-password" name="password" type="password" minlength="10" autocomplete="new-password" required><small>At least 10 characters.</small></div><button>Create account</button></form>
<form id="trial-form" class="form hidden"><p>One verified email receives one 1 GB trial for one device.</p><div class="form-row"><div class="field"><label for="trial-name">Name</label><input id="trial-name" name="name" required></div><div class="field"><label for="trial-email">Email</label><input id="trial-email" name="email" type="email" required></div></div><button type="button" class="secondary request-code">Send verification code</button><div class="form-row"><div class="field"><label for="trial-code">Six-digit code</label><input id="trial-code" name="code" inputmode="numeric" maxlength="6" required></div><div class="field"><label for="trial-device">Device code name</label><input id="trial-device" name="codeName" maxlength="80" placeholder="My phone" required></div></div><button>Start 1 GB free</button></form><p id="auth-message" class="message" role="status"></p></section></main><script src="/model.js"></script><script src="/auth.js"></script></body></html>
