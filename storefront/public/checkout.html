<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout · Bright Pocket VPN</title><link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/styles.css"></head><body>
<header class="shell nav"><a class="brand" href="/"><span class="brand-mark"></span>Bright Pocket VPN</a><a href="/dashboard.html">Dashboard</a></header>
<main class="shell page"><div class="page-head"><h1>Pay, upload proof, then we approve.</h1><a href="/">Change plan</a></div><form id="checkout-form" class="panel wide form">
<section id="guest-checkout" class="hidden"><h2>Continue as guest</h2><p>Verify your email. No account is required.</p><div class="form-row"><div class="field"><label for="guest-name">Name</label><input id="guest-name" name="name"></div><div class="field"><label for="guest-email">Email</label><input id="guest-email" name="email" type="email"></div></div><div class="form-row"><button type="button" class="secondary" id="guest-send-code">Send six-digit code</button><div class="field"><label for="guest-code">Verification code</label><input id="guest-code" inputmode="numeric" maxlength="6"></div></div><div class="field"><label for="guest-code-name">Device code name</label><input id="guest-code-name" name="codeName" maxlength="80" placeholder="For example, My phone"></div></section>
<div class="form-row"><div class="field"><label for="profile">Device profile</label><select id="profile" name="profileId" required><option value="">Choose a code name</option><option value="__new__">Add a new device…</option></select></div><div class="field"><label for="months">Plan length</label><select id="months" name="months"><option>1</option><option>2</option><option>3</option><option>6</option><option>12</option></select></div></div><div id="new-code-field" class="field hidden"><label for="new-code-name">New device code name</label><input id="new-code-name" maxlength="80" placeholder="For example, Work phone"></div>
<div id="checkout-summary" class="summary-box" aria-live="polite"></div><fieldset><legend><strong>Payment method</strong></legend><div class="payment-methods"><label class="payment-choice"><input type="radio" name="paymentMethod" value="wechat"> WeChat Pay</label><label class="payment-choice"><input type="radio" name="paymentMethod" value="alipay"> Alipay</label></div></fieldset>
<div id="qr-area" class="hidden"><p>Scan this QR code, pay the exact amount above, then upload your screenshot.</p><img id="qr-image" class="qr" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Selected payment QR code"></div>
<div class="field"><label for="proof">Payment screenshot</label><input id="proof" name="proof" type="file" accept="image/png,image/jpeg,image/webp" required><img id="proof-preview" class="proof-preview hidden" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Payment screenshot preview"></div>
<button id="submit-order" disabled>Submit for approval</button><p id="checkout-message" class="message" role="status"></p></form></main><script src="/model.js"></script><script src="/checkout.js"></script></body></html>
